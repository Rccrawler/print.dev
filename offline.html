<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#dfaf49">
    <title>Sin conexión</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
        }

        body {
            align-items: center;
            background: #f8f9fa;
            color: #212529;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            text-align: center;
        }

        main {
            max-width: 32rem;
            padding: 2rem;
        }

        img {
            height: 96px;
            margin-bottom: 1rem;
            width: 96px;
        }

        h1 {
            color: #3b4cca;
            margin: 0 0 1rem;
        }

        p {
            line-height: 1.5;
        }

        button {
            background: #dfaf49;
            border: 0;
            border-radius: 0.375rem;
            color: #212529;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            margin-top: 1rem;
            padding: 0.75rem 1rem;
        }
    </style>
</head>
<body>
    <main>
        <img src="img/favicon.svg" alt="icon">
        <h1>print.dev no está disponible ahora</h1>
        <p>No tienes conexión a Internet y esta página todavía no está disponible sin conexión.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
